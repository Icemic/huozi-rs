[package]
description = "A simple typography engine for CJK languages, especially designed for game rich-text."
edition = "2024"
exclude = ["examples"]
license = "Apache-2.0"
name = "huozi"
repository = "https://github.com/Icemic/huozi-rs"
version = "0.20.0"

include = ["src/**/*", "Cargo.toml", "./README.md", "./README_EN.md", "LICENSE"]

[features]
charsets = []
default = ["wgpu", "charsets"]
wgpu = ["dep:wgpu"]

[dependencies]
ab_glyph_rasterizer = "0.1"
anyhow = "1"
bytemuck = {version = "1.4", features = ["derive"]}
csscolorparser = {version = "0.8.0", features = ["serde"]}
harfrust = "0.13"
log = "0.4"
lru = "0.18.2"
nom = {version = "8.0"}
nom-language = {version = "0.1"}
nom_locate_usv = {version = "5.1.0", features = ["runtime-dispatch-simd"]}
serde = {version = "1", features = ["derive"]}
skrifa = "0.46"
tiqian = "0.3"
wgpu = {version = "30.0", optional = true}

[dev-dependencies]
cfg-if = "1"
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
env_logger = "0.11"
image = {version = "0.25", default-features = false, features = ["png"]}
pollster = "1.0"
rustybuzz = "0.20"
ttf-parser = "0.25"
wgpu = "30.0"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = {version = "0.3", features = ["Document", "Window", "Element"]}
wgpu = {version = "30.0", features = ["webgl"]}

[target.'cfg(target_os = "android")'.dev-dependencies]
android_logger = "0.15"
winit = {version = "0.30.13", features = ["android-game-activity"]}

[[example]]
name = "render"
path = "examples/render/main.rs"

[[example]]
crate-type = ["cdylib"]
name = "render-lib"
path = "examples/render/main.rs"

